name: Full Build and Test

on:
  # This job takes a long time to run, so only run it when the canary build passes
  # Ideally we'd use the workflow_run trigger and have GitHub launch this action, but the docs state:
  #     This event will only trigger a workflow run if the workflow file is on the default branch.
  # ...which leads to some interesting behaviors
  workflow_call:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  Full-Build-Ubuntu:
    runs-on: ${{ matrix.os }}

    strategy:
      # We want to test all matrix combinations regardless of failure
      fail-fast: false

      matrix:
        os: 
          - ubuntu-24.04
          - ubuntu-22.04
        build_type:
          - Release
          - Sanitize
        cpp_compiler:
          - g++
          - clang++

    env:
      output_folder: ${{github.workspace}}/build/

    steps:
    - uses: actions/checkout@v5

    - name: Configure CMake
      env:
        # Map from C++ compiler to equivalent C compiler
        g++: gcc
        clang++: clang
      run: >
        cmake -S . -B "${{ env.output_folder }}"
        -DCMAKE_C_COMPILER=${{ env[matrix.cpp_compiler] }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DLIBDIVIDE_BUILD_TESTS=ON
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Build
      run: cmake --build "${{ env.output_folder }}" --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ env.output_folder }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }} --verbose

  Full-Build-Windows:
    runs-on: ${{ matrix.os }}

    strategy:
      # We want to test all matrix combinations regardless of failure
      fail-fast: false
      # This makes development easier
      # max-parallel: 0
      matrix:
        os:
          - windows-2022
          - windows-2025
        build_type:
          - Release
          - Sanitize
        cpp_compiler:
          - clang-cl.exe
          - cl.exe
        include:
          # Set generator per os
          # Note: These *expand* the existing matrix configurations, it doesn't create new matrix configurations
          # See https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstrategymatrixinclude
          - os: windows-2022
            generator: Visual Studio 17 2022
          - os: windows-2025
            generator: Visual Studio 17 2022
          # clang-cl requires the toolset flag be set correctly 
          - cpp_compiler: clang-cl.exe
            toolset: ClangCL            
        exclude:
          # MSVC Clang toolchain fails sanitization
          - cpp_compiler: clang-cl.exe
            build_type: Sanitize

    env:
      output_folder: ${{github.workspace}}/build/

    steps:
    - uses: actions/checkout@v5

    - name: Configure CMake, Build & Test
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALLDIR=%%i"
        call "%VSINSTALLDIR%\Common7\Tools\VsDevCmd.bat" -arch=x64
        cmake -S . -B "${{ env.output_folder }}" -G "${{ matrix.generator }}" ${{ matrix.toolset && format('-T {0}', matrix.toolset) || '' }} -DCMAKE_C_COMPILER=${{ matrix.cpp_compiler }} -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }} -DLIBDIVIDE_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.build_type == 'Sanitize' && '-DLIBDIVIDE_ENABLE_SANITIZERS=ON' || '' }}
        cmake --build "${{ env.output_folder }}" --config ${{ matrix.build_type }}
        cd /d "${{ env.output_folder }}"
        ctest --build-config ${{ matrix.build_type }} --verbose
